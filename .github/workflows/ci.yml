name: CI and release artifacts

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish reviewed artifacts to PyPI (explicit release authorization required)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release_gate:
    name: Check current package release on main
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether this version is already on PyPI
        id: version
        run: |
          current_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/bankai-boruta/${current_version}/json")"
          if [[ "${status}" == "404" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "changed=true; ${current_version} is not yet published on PyPI."
          elif [[ "${status}" == "200" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "changed=false; ${current_version} is already published on PyPI."
          else
            echo "::error::Could not verify PyPI release state (HTTP ${status})."
            exit 1
          fi

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: ${{ startsWith(matrix.runner, 'macos-') && '-C link-arg=-undefined -C link-arg=dynamic_lookup' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 / Python 3.11
            runner: ubuntu-24.04
            python: "3.11"
            coverage: true
          - name: Linux x86_64 / Python 3.12
            runner: ubuntu-24.04
            python: "3.12"
          - name: Linux x86_64 / Python 3.13
            runner: ubuntu-24.04
            python: "3.13"
          - name: Linux x86_64 / Python 3.14
            runner: ubuntu-24.04
            python: "3.14"
          - name: Linux ARM64 / Python 3.11
            runner: ubuntu-24.04-arm
            python: "3.11"
          - name: Windows x86_64 / Python 3.11
            runner: windows-2025
            python: "3.11"
          - name: macOS x86_64 / Python 3.11
            runner: macos-15-intel
            python: "3.11"
          - name: macOS ARM64 / Python 3.11
            runner: macos-15
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.21
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install project and test dependencies
        run: uv sync --python ${{ matrix.python }} --locked --no-install-project --extra test

      - name: Add uv Python shared library to runtime path
        if: matrix.runner == 'ubuntu-24.04' || matrix.runner == 'ubuntu-24.04-arm'
        run: echo "LD_LIBRARY_PATH=$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'):${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and install the native extension
        run: uv run --no-sync maturin develop --release --locked

      - name: Run Python tests
        if: matrix.coverage == true
        run: uv run --no-sync pytest --cov=bankai_boruta --cov-report=xml:coverage.xml -q

      - name: Upload Python coverage to Codecov
        if: matrix.coverage == true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CODECOV_TOKEN || '' }}

      - name: Run Python tests on other platforms
        if: matrix.coverage != true
        run: uv run --no-sync pytest -q

      - name: Run Rust tests
        run: uv run --no-sync cargo test --workspace --locked

  wheels:
    name: Build wheel (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: ${{ startsWith(matrix.runner, 'macos-') && '-C link-arg=-undefined -C link-arg=dynamic_lookup' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.15.0
          args: --release --locked --out dist

      - name: Verify wheel ABI and platform tag
        shell: bash
        env:
          WHEEL_TARGET: ${{ matrix.target }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one platform wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          wheel="${wheels[0]}"
          if [[ "${wheel}" != *-cp311-abi3-* ]]; then
            echo "Expected a CPython 3.11 stable-ABI wheel: ${wheel}" >&2
            exit 1
          fi
          case "${WHEEL_TARGET}" in
            x86_64-unknown-linux-gnu)
              [[ "${wheel}" == *manylinux*x86_64.whl ]] ;;
            aarch64-unknown-linux-gnu)
              [[ "${wheel}" == *manylinux*aarch64.whl ]] ;;
            x86_64-pc-windows-msvc)
              [[ "${wheel}" == *win_amd64.whl ]] ;;
            x86_64-apple-darwin)
              [[ "${wheel}" == *macosx*x86_64.whl ]] ;;
            aarch64-apple-darwin)
              [[ "${wheel}" == *macosx*arm64.whl ]] ;;
            *) echo "Unknown wheel target: ${WHEEL_TARGET}" >&2; exit 1 ;;
          esac
          echo "Validated ${wheel}"

      - name: Install uv for installed-wheel smoke
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.21

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          uv python install 3.11
          wheels=(dist/*.whl)
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            forest_source="$(uv run --no-project --python 3.11 python -c 'import tomllib; s=tomllib.load(open("pyproject.toml","rb"))["tool"]["uv"]["sources"]["bankai-random-forest"]; print("bankai-random-forest @ git+"+s["git"]+"@"+s["rev"])')"
            uv run --no-project --python 3.11 --with "$forest_source" --with "${wheels[0]}" python -I scripts/smoke_installed.py
          else
            # Publication builds must resolve the already-published RF alpha16.
            uv run --no-project --python 3.11 --with "${wheels[0]}" python -I scripts/smoke_installed.py
          fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: Build source distribution
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.21
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build source distribution
        run: uv build --sdist --out-dir dist

      - name: Upload source distribution artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  distributions:
    name: Collect release distributions
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.21

      - name: Install SBOM generators
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate Rust and Python CycloneDX SBOMs from lockfiles
        run: |
          mkdir -p dist/packages
          mv dist/*.whl dist/*.tar.gz dist/packages/
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo cyclonedx --manifest-path Cargo.toml --format json --override-filename rust-sbom
          python - <<'PYTHON'
          from pathlib import Path
          files = sorted(Path("crates").rglob("rust-sbom.json"))
          if len(files) != 2:
              raise SystemExit(f"Expected two workspace SBOMs, found {len(files)}")
          for path in files:
              path.rename(Path("dist") / f"bankai-boruta-{path.parent.name}-rust.cdx.json")
          PYTHON
          uv export --locked --no-dev --all-extras --no-emit-project --format requirements-txt --output-file dist/requirements-sbom.txt
          uvx --from cyclonedx-bom==7.5.0 cyclonedx-py requirements dist/requirements-sbom.txt --of JSON -o dist/bankai-boruta-python.cdx.json
          rm dist/requirements-sbom.txt

      - name: Validate release distributions and generate checksums
        run: python scripts/release_artifacts.py dist

      - name: Upload complete release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bankai-boruta-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest release artifacts
    needs: distributions
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bankai-boruta-release
          path: dist
      - name: Generate artifact provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**'

  publish:
    name: Publish release to PyPI
    needs: [release_gate, distributions, attest]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && needs.release_gate.outputs.changed == 'true'
    concurrency:
      group: publish-${{ needs.release_gate.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/bankai-boruta/${{ needs.release_gate.outputs.version }}/
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bankai-boruta-release
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/packages/

  github_release:
    name: Create GitHub release
    needs: [distributions, attest]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bankai-boruta-release
          path: dist

      - name: Publish complete GitHub release with verified checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_github_release.py

  exact_session_parity:
    name: Exact session controlled Linux evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.21
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Install candidate and frozen reference
        run: |
          uv python install 3.13
          uv sync --python 3.13 --locked --no-install-project --extra test
          export LD_LIBRARY_PATH="$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'):${LD_LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          uv run --no-sync maturin develop --release --locked
          uv venv .venv-reference --python 3.13
          uv pip install --python .venv-reference/bin/python bankai-boruta==0.1.0a6 bankai-random-forest==0.1.0a15
      - name: Check parity and controlled fits sequentially
        run: |
          uv run --no-sync pytest tests/test_exact_session.py -q
          uv run --no-sync python benchmarks/compare_exact_session.py --reference-python "$PWD/.venv-reference/bin/python" --candidate-python "$PWD/.venv/bin/python" --output evidence/fixed-t1.json
          uv run --no-sync python benchmarks/compare_exact_session.py --reference-python "$PWD/.venv-reference/bin/python" --candidate-python "$PWD/.venv/bin/python" --output evidence/complete-t1.json --rows 2000 --columns 40 --trees 10 --fixed-rounds 0 --max-iter 120
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-session-linux-controlled
          path: evidence/*.json
