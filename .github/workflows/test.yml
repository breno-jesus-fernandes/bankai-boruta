name: tests
on: [push, pull_request]
jobs:
  arrow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
        polars: ['1.32.0', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: uv sync --extra test --extra arrow-test
      - if: matrix.polars != 'latest'
        run: uv pip install polars==${{ matrix.polars }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: uv run --no-sync maturin develop --release --skip-install
      # Required imports prevent optional test dependencies from silently skipping.
      - run: uv run --no-sync python -c 'import polars, pyarrow, psutil'
      - run: uv run --no-sync pytest
      - run: uv build --sdist --wheel
      - name: Installed wheel without optional Python libraries
        run: |
          uv venv /tmp/bankai-smoke
          uv pip install --python /tmp/bankai-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/bankai-smoke/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --without-polars
      - name: Installed wheel with Polars
        run: |
          uv pip install --python /tmp/bankai-smoke/bin/python polars
          cd /tmp
          /tmp/bankai-smoke/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
