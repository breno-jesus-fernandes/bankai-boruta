version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    groups:
      arrow:
        patterns: ["arrow-*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
