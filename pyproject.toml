[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bankai-boruta"
version = "0.1.0a3"
description = "Native Rust Boruta feature selection for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
license-files = ["COPYING"]
dependencies = [
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "bankai-random-forest==0.1.0a15",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-benchmark>=5.1", "pandas>=2.2", "Boruta==0.4.3", "greedyboruta==1.0.0", "psutil>=6"]

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8.3", "pytest-benchmark>=5.1", "pytest-cov>=6"]

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "bankai_boruta._boruta_core"
bindings = "pyo3"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
