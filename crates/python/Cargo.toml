[package]
name = "bankai-boruta-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 extension module for bankai-boruta."
repository = "https://github.com/breno-jesus-fernandes/bankai-boruta"
homepage = "https://github.com/breno-jesus-fernandes/bankai-boruta"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
boruta-core = { path = "../boruta-core", version = "=0.1.0-alpha.2" }
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }

bankai-arrow-ffi = { path = "../arrow-ffi", version = "=0.1.0-alpha.2" }
arrow-array = "=59.3.0"
arrow-schema = "=59.3.0"

[lints.rust]
unsafe_code = "forbid"
