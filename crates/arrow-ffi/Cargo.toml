[package]
name = "bankai-arrow-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Narrow checked Apache Arrow C Stream bridge for Bankai Boruta."
repository = "https://github.com/breno-jesus-fernandes/bankai-boruta"
homepage = "https://github.com/breno-jesus-fernandes/bankai-boruta"

[dependencies]
arrow-array = { version = "=59.3.0", features = ["ffi"] }
arrow-schema = "=59.3.0"
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
